[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idkfa"
version = "0.2.0"
description = "Generador de cuestionarios Moodle XML desde plantillas C con autocompletado y CLI moderna"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
idkfa = "generador:main"

[tool.hatch.build.targets.wheel]
packages = ["idkfa"]
force-include = { "generador.py" = "generador.py" }
