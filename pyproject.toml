[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idkfa"
version = "0.1.0"
description = "Generador de cuestionarios Moodle XML desde plantillas C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
idkfa = "generador:main"

[tool.hatch.build.targets.wheel]
force-include = { "generador.py" = "generador.py" }
