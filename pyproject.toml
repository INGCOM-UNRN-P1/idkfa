[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idkfa"
version = "0.3.0"
description = "Generador de cuestionarios Moodle XML desde plantillas C con autocompletado y CLI moderna"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Núcleo común del ecosistema (N-ECO-14): contrato de línea de comandos y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN-P1/yutani@4b99a428c28ab5f3c3013b770b9692ade6182fc2",
]

[project.optional-dependencies]
# Herramientas del ecosistema que se usan como biblioteca (N-ECO-01). Referencias git fijadas
# a commits publicados (nunca por nombre: esos nombres están tomados en PyPI por terceros).
# Sin `ecosistema`, se compila con gcc directo; sin `languagetool`, spellcheck explica cómo
# instalarlo.
ecosistema = [
    "daedalus @ git+https://github.com/INGCOM-UNRN-P1/daedalus@cd3eb998193cd5bd9ea881aa9a0e19f5fe6d9a86",
]
languagetool = [
    "myst-tools @ git+https://github.com/martinvilu/mystmd-tools@a55f7db83b03aa1da9485b3cf70c49b71ece2664",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/idkfa"
Repository = "https://github.com/INGCOM-UNRN-P1/idkfa.git"
Issues = "https://github.com/INGCOM-UNRN-P1/idkfa/issues"

[project.scripts]
idkfa = "idkfa.generacion:main"

[tool.hatch.build.targets.wheel]
packages = ["idkfa"]
force-include = { "generador.py" = "generador.py" }

[tool.hatch.metadata]
# Las dependencias del ecosistema son referencias directas a git (nunca por nombre en PyPI).
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
